# 短视频口播文案 · 人设配置（固定参数）
#
# 用法：复制本文件为 persona.yaml，放到以下任一位置（按优先级查找）：
#   1. ./persona.yaml                       当前项目根目录
#   2. ./.short-video-script/persona.yaml   当前项目配置目录
#   3. ~/.short-video-script/persona.yaml   个人全局配置
#
# 多账号：同目录下可放多份，如 persona.zhaopin.yaml / persona.baoma.yaml，
#         生成时用 --profile zhaopin 指定，或直接在对话里说明用哪份配置。

# ── 元信息 ────────────────────────────────────────────────
profile: it-ai-career          # 配置标识，便于多账号区分
account: IT/AI 职业规划师       # 账号名称/备注
platform: 抖音                  # 主投放平台：抖音 / 小红书 / 视频号 / B站

# ── 1. 人设模型 ───────────────────────────────────────────
# 可选：同龄伙伴 | 靠谱顾问（也可自定义，但需一句话说清内容供给方式）
persona_model:
  type: 靠谱顾问
  description: |
    理性沉稳不吹嘘，持续输出专业就职、职场干货，以及亲自实战 Vlog

# ── 2. 人设定位（自身优势：身份、性格等）──────────────────
persona_position:
  identity: |
    20 年大厂 IT/AI 从业者、涉猎财务、企业 ERP、互联网、金融行业相关 IT 技术
  value: |
    致力于为广大 IT/AI 从业者提供专业的成长规划、能力评估、技能调整，就业帮扶服务
  style: |
    客观理性、沉稳中肯，成长励志

# ── 3. 人群画像（年龄、身份等）────────────────────────────
audience:
  age: 20-35 岁
  identity: 年轻求职者、职场困惑者、年轻人家长

# ── 4. 用户需求（越具体越好，直接决定选题命中率）──────────
audience_needs:
  - 不了解自己要学什么才能赚到更多的钱
  - 不了解目前什么行业吃香、有发展前景
  - 不了解什么行业适合自己
  - 不了解子女的专业有没有就业前景
  - 自己的岗位正在被 AI 取代，裁员越来越多，很焦虑
  - 不知道什么子女做什么行业才体面

# ── 5. 人设风格（陪伴、专家等）────────────────────────────
persona_style:
  type: 专家型，专业靠谱
  service_path:
    - 分析客户现状（年龄、学历、专业、工作经验、当前薪资等等），精准定位用户画像
    - 提供广泛、专业的潜在多种行业类型匹配与沟通，确认最终的目标岗位
    - 部析现有能力差距，提供补完计划，以及相应的培训建议
    - 陪跑，咨询服务，最终达到企业接纳与输送、个人薪资跃迁的目标

# ── 6. 价值定位（你能做什么？解决什么问题？）──────────────
value_proposition:
  - 分享 IT、AI 行业的最新热门缺口岗位需求和薪资信息差
  - 分享个人成长路径，建立自信心，强调选择大于努力
  - 以亲身经历来提供行业避坑指南
  - 以个人亲身实战的方式，来引导与感染用户如何按步骤达到职业目标

# ── 25 宫格（选题坐标系）──────────────────────────────────
# inner：内圈，账号的核心锚点，通常只有 1 个，每条选题都要挂在它上面
# middle：中圈，业务领域切面
# outer：外圈，人群与场景
matrix:
  inner:
    - AI就业
  middle:
    - 求职
    - 面试
    - 专业
    - 薪资
    - 晋升
    - 岗位/职业
    - 培训
    - AIGC
  outer:
    - 毕业生
    - 求职者
    - 待转行
    - 专/本科生
    - 机构
    - 考公/编
    - 失业/被裁
    - 文/理科生
    - 不同专业
    - 普通人
    - 找对象
    - 大厂
    - 投资成本
    - 发展前景
    - 职场
    - 保障

# ── 输出偏好 ──────────────────────────────────────────────
output:
  min_words: 500               # 正文最少字数（口播文案硬要求）
  language_level: 大白话，奶奶也能听懂
  forbidden_words:             # 全局禁用词（合规 + 人设一致性）
    - 保证就业
    - 包分配
    - 稳赚
    - 零风险
    - 内部名额
  cta_style: 资料式引导          # 软引流方式：分享式引导 | 资料式引导 | 场景式引导
  cta_asset: 四个方向的学习路线图  # 用来做钩子的干货资产
